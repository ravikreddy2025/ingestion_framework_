# PRIMARY INGESTION - one job definition, every topic.
#
# A new source is added by appending a task to the `tasks` list below with a different
# source-key. No new job, no new notebook, no code change - and this job serves every
# source TYPE, not only Kafka: the entrypoint dispatches on the `source_type:` declared in
# that source's own conf/sources/<key>.yaml.
#
# THE TASKS ARE DUPLICATED ON PURPOSE (for now). They differ only in task_key and source-key,
# so YAML anchors would remove the repetition - but bundle schema validation of anchors could
# not be confirmed here, and a bundle that fails to parse blocks every deployment. The
# duplication is visible and harmless; a broken bundle is neither. If you do introduce
# anchors, run `databricks bundle validate -t dev` before merging.
# Keep the retry settings identical across tasks - they had already drifted once. (If the domain prefers full
# isolation of failure blast radius, the same job definition can instead be run once per
# topic from a scheduler loop - the entrypoint is identical either way.)
#
# SERVERLESS COMPUTE DEPENDENCY
# -----------------------------
# The environment below targets serverless jobs compute. That requires network
# connectivity from the serverless egress to every Kafka bootstrap endpoint AND every
# Schema Registry in conf/, via Network Connectivity Configuration (NCC) private
# endpoints or firewall allowlisting of the NCC's stable egress IPs.
# For the on-prem clusters (cp_onprem_rcm, cp_onprem_antifraud) that connectivity is NOT
# assumed - confirm it per cluster before moving those topics off classic compute.
#
# If it turns out serverless cannot reach them, replace `environment_key: ingest_env` with
# `job_cluster_key: classic_ingest` on the affected tasks and uncomment the `job_clusters`
# block below. It is defined but unused on purpose: writing it during an incident, against
# a cluster policy you have not read, is not when you want to be choosing a node type.

resources:
  jobs:

    ingest_primary:
      name: "[${bundle.target}] Kafka Ingest - Primary"
      description: >-
        Daily Kafka -> landing/curated ingestion. Trigger.AvailableNow, one run per day.
        Behaviour per topic is controlled by the control table named in conf/defaults.yaml;
        structure by conf/ in Git.

      schedule:
        # 02:15 UTC daily. Trigger.AvailableNow drains whatever has accumulated and stops.
        quartz_cron_expression: "0 15 2 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      # ONE AT A TIME, ALWAYS. Two drivers on one checkpoint corrupt its offsets/
      # directory, and the recovery from that is the checkpoint-reset procedure - a
      # deliberate, single-use, incident-scoped bypass of the guard against silent data
      # loss. Nothing this job could gain from overlapping runs is worth being one step
      # from that.
      max_concurrent_runs: 1

      # A run that arrives while one is in flight is DROPPED, not queued. Queueing would
      # start the second run the moment the first finished, which for a checkpointed
      # streaming source means a second drain of a topic that has just been drained -
      # billed compute for an empty batch. The next scheduled run covers it.
      queue:
        enabled: false

      parameters:
        - name: config_root
          default: ${workspace.file_path}/conf
        - name: environment
          # Selects conf/environments/<env>.yaml. Defaulted from the bundle target, so
          # dev/preprod/prod is declared once in databricks.yml and never typed again.
          default: ${bundle.target}

      email_notifications:
        on_failure:
          - ${var.notification_email}

      environments:
        - environment_key: ingest_env
          spec:
            client: "3"
            dependencies:
              - ./dist/*.whl

      # Classic-compute fallback for topics whose brokers serverless cannot reach. Unused
      # until a task references it - see the note at the top of this file. Confirm the node
      # type and runtime against your workspace's cluster policy before enabling.
      # job_clusters:
      #   - job_cluster_key: classic_ingest
      #     new_cluster:
      #       spark_version: "15.4.x-scala2.12"
      #       node_type_id: Standard_D4ds_v5
      #       num_workers: 2
      #       data_security_mode: SINGLE_USER

      tasks:

        - task_key: vector_patient_events
          environment_key: ingest_env
          # Retries are safe by construction: the checkpoint has not advanced past a
          # failed batch, so a retry re-reads the IDENTICAL offset range, and Delta's
          # txnAppId/txnVersion markers suppress the duplicate landing write.
          max_retries: 3
          min_retry_interval_millis: 300000
          # Stated on every task, never folded into a YAML anchor: a timeout means the run
          # did not finish in its window, and retrying it immediately usually means it will
          # not finish in the next one either. These three had already drifted apart once.
          retry_on_timeout: false
          timeout_seconds: 10800
          python_wheel_task:
            package_name: kafka_ingest
            entry_point: run-ingest
            named_parameters:
              config-root: "{{job.parameters.config_root}}"
              environment: "{{job.parameters.environment}}"
              source-key: vector_patient_events
              job-run-id: "{{job.run_id}}"

        - task_key: rcm_claim_status
          environment_key: ingest_env
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: false
          timeout_seconds: 10800
          python_wheel_task:
            package_name: kafka_ingest
            entry_point: run-ingest
            named_parameters:
              config-root: "{{job.parameters.config_root}}"
              environment: "{{job.parameters.environment}}"
              source-key: rcm_claim_status
              job-run-id: "{{job.run_id}}"

        - task_key: antifraud_txn_alerts
          environment_key: ingest_env
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: false
          timeout_seconds: 10800
          python_wheel_task:
            package_name: kafka_ingest
            entry_point: run-ingest
            named_parameters:
              config-root: "{{job.parameters.config_root}}"
              environment: "{{job.parameters.environment}}"
              source-key: antifraud_txn_alerts
              job-run-id: "{{job.run_id}}"
