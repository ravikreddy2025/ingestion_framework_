# TABLE MAINTENANCE - compaction and file reclamation for the tables this framework owns.
#
# Separate from the ingestion jobs on purpose: it touches every topic's data, it is not
# urgent, and it must never be able to make an ingestion run fail. If maintenance breaks,
# ingestion keeps working and someone fixes maintenance on Monday.
#
# ONE TASK PER SOURCE, because landing is one table per source. Adding a source means adding
# a task here with its landing table name - the same five-line copy as job_ingest_primary.yml
# / job_ingest_oracle.yml / job_ingest_file.yml. The shared settings live in the anchor so
# they cannot drift between tasks.
#
# COVERAGE (docs/build_log/DECISIONS.md D-11): the three Kafka topics and the file source
# below are covered. The Oracle source (oracle_claim_header) is NOT - that gap was flagged
# in docs/build_log/STAGE_5_REPORT.md decision 8 as shared with the file source, and this
# pass closes only the file half, per the instruction that produced D-11. Flagged again here
# so it is not mistaken for closed.
#
# BEFORE THIS DEPLOYS, set `sql_warehouse_id` in databricks.yml. The default is a placeholder.
#
# WHAT IT DOES NOT DO
# -------------------
# It does not delete data. The 20-year landing retention policy is parameterised in
# sql/04_maintenance.sql but the DELETE is commented out - switching on automatic deletion of
# raw payloads is a decision for the data owner, not a default. See that file for the two
# questions to settle first (quarantine, and curated).

resources:
  jobs:

    maintenance:
      name: "[${bundle.target}] Kafka Ingest - Table Maintenance"
      description: >-
        OPTIMIZE and VACUUM over each topic's landing table and the shared audit table.
        Retention parameters come from the bundle variables landing_retention_days and
        vacuum_retention_hours, so each environment can differ. Does not delete data.

      schedule:
        # 04:30 UTC on Sundays - well clear of the 02:15 daily ingestion window, and weekly
        # is enough for tables that autoOptimize is already compacting on write.
        quartz_cron_expression: "0 30 4 ? * SUN"
        timezone_id: UTC
        pause_status: UNPAUSED

      # Maintenance overlapping itself achieves nothing and competes for the same files.
      max_concurrent_runs: 1

      # Dropped, not queued. A missed weekly OPTIMIZE costs nothing - the next one does the
      # same work - whereas a queued one starts the moment the first finishes and competes
      # with whatever is running by then.
      queue:
        enabled: false

      email_notifications:
        on_failure:
          - ${var.notification_email}

      parameters:
        - name: catalog
          # The DATA catalog, holding the per-source layer tables. Must match vars.catalog
          # in conf/environments/<target>.yaml; a test asserts they agree.
          default: ${var.data_catalog}
        - name: ops_catalog
          # The OPS catalog, holding the audit table (docs/build_log/DECISIONS.md D-06).
          # sql/04 binds :ops_catalog for its two audit-table statements; without this
          # parameter those two statements fail to bind and the job fails every week.
          # Must match vars.ops_catalog in conf/environments/<target>.yaml; the same test
          # asserts that too.
          default: ${var.ops_catalog}
        - name: landing_retention_days
          default: ${var.landing_retention_days}
        - name: vacuum_retention_hours
          default: ${var.vacuum_retention_hours}

      tasks:
        # Shared task settings. No retries: OPTIMIZE and VACUUM are idempotent, but a failure
        # means the warehouse or the grants are wrong, and repeating will not fix that.
        - &maintenance_task
          task_key: vector_patient_events
          max_retries: 0
          timeout_seconds: 14400
          # retry_on_timeout is stated on every task below rather than inherited from this
          # anchor: it is the one retry setting whose right answer can differ per task, and
          # a value that arrives invisibly through a merge key is a value nobody reviews.
          retry_on_timeout: false
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/04_maintenance.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
              ops_catalog: "{{job.parameters.ops_catalog}}"
              landing_retention_days: "{{job.parameters.landing_retention_days}}"
              vacuum_retention_hours: "{{job.parameters.vacuum_retention_hours}}"
              # Derived from the Kafka topic name - see sources/kafka/config.py
              # table_name_for(). If a source
              # sets `table_name:` in its config file, use that name here instead.
              landing_table: "${var.data_catalog}.landing.vector_patient_events_v1"

        - <<: *maintenance_task
          task_key: rcm_claim_status
          retry_on_timeout: false
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/04_maintenance.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
              ops_catalog: "{{job.parameters.ops_catalog}}"
              landing_retention_days: "{{job.parameters.landing_retention_days}}"
              vacuum_retention_hours: "{{job.parameters.vacuum_retention_hours}}"
              landing_table: "${var.data_catalog}.landing.rcm_claim_status_v2"

        - <<: *maintenance_task
          task_key: antifraud_txn_alerts
          retry_on_timeout: false
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/04_maintenance.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
              ops_catalog: "{{job.parameters.ops_catalog}}"
              landing_retention_days: "{{job.parameters.landing_retention_days}}"
              vacuum_retention_hours: "{{job.parameters.vacuum_retention_hours}}"
              landing_table: "${var.data_catalog}.landing.antifraud_txn_alerts_v1"

        # File source (Stage 5 / D-11). sql/04_maintenance.sql's OPTIMIZE/VACUUM shape is
        # source-agnostic - it only needs a landing table name - so no SQL change was needed
        # to cover this source, only this task.
        - <<: *maintenance_task
          task_key: file_claims_inbound
          retry_on_timeout: false
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/04_maintenance.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
              ops_catalog: "{{job.parameters.ops_catalog}}"
              landing_retention_days: "{{job.parameters.landing_retention_days}}"
              vacuum_retention_hours: "{{job.parameters.vacuum_retention_hours}}"
              # Derived from target_schema/target_table in conf/sources/file_claims_inbound.yaml
              # - see sources/file/config.py FileConfig.landing_table.
              landing_table: "${var.data_catalog}.files_claims.claims_inbound"
