# REPLAY JOBS - triggered by hand from the Workflows UI, never scheduled.
#
# Two separate jobs on purpose. They solve different problems and confusing them during an
# incident is expensive:
#
#   replay_kafka    data is MISSING or WRONG AT SOURCE. Re-pulls from the broker from a
#                   given offset/timestamp into an ISOLATED checkpoint with its own Delta
#                   txnAppId. Subject to Kafka retention.
#                   ALSO the correct tool if someone deleted a primary checkpoint.
#   replay_curated  the bytes are fine, the PARSE was not. Re-reads the landing table, no
#                   broker contact, works forever regardless of retention.
#
# Both are parameterised identically to the primary job and reuse the same modules.

resources:
  jobs:

    replay_kafka:
      name: "[${bundle.target}] Kafka Ingest - REPLAY from Kafka"
      description: >-
        Re-pull a topic from a given offset or timestamp. Writes into an isolated
        checkpoint keyed by rerun_id. Landing inserts-if-absent, curated upserts.
        Rows are tagged ingested_via='kafka_replay' and replay_run_id=<rerun_id>.
      # ONE AT A TIME. A replay writes into its own checkpoint and its own Delta
      # transaction identity, so two replays of DIFFERENT sources could in principle run
      # together - but two runs of this one job cannot tell each other apart, and a second
      # replay launched against the same source while the first is in flight would share
      # both. Recovering two sources means running this twice, in sequence.
      max_concurrent_runs: 1

      # Dropped, not queued: a replay is a deliberate human action with parameters typed
      # for one incident. A queued second run would fire later with parameters nobody is
      # still watching.
      queue:
        enabled: false

      parameters:
        - name: source_key
          default: ""
        - name: rerun_id
          # REQUIRED. Isolates BOTH the checkpoint path and the Delta txnAppId, which is
          # what stops a replay colliding with the primary stream's idempotency markers.
          default: ""
        - name: replay_starting_offsets
          # Spark startingOffsets JSON. -2 = earliest, -1 = latest.
          default: ""
        - name: replay_starting_timestamp
          # ISO-8601 (2026-08-11T09:00:00Z) or epoch millis. Mutually exclusive with offsets.
          default: ""
        - name: replay_ending_offsets
          # Optional. Present => bounded batch replay rather than a streaming replay.
          default: ""
        - name: replay_ending_timestamp
          default: ""
        - name: config_root
          default: ${workspace.file_path}/conf
        - name: environment
          # Selects conf/environments/<env>.yaml. Defaulted from the bundle target, so the
          # environment is never typed twice and a replay cannot be aimed at the wrong one.
          default: ${bundle.target}

      environments:
        - environment_key: ingest_env
          spec:
            client: "3"
            dependencies:
              - ./dist/*.whl

      tasks:
        - task_key: replay
          environment_key: ingest_env
          # No automatic retries. A replay is a deliberate human action; if it fails, a
          # human should read the audit rows before it runs again.
          max_retries: 0
          retry_on_timeout: false
          timeout_seconds: 21600
          python_wheel_task:
            package_name: kafka_ingest
            entry_point: run-replay
            named_parameters:
              config-root: "{{job.parameters.config_root}}"
              environment: "{{job.parameters.environment}}"
              source-key: "{{job.parameters.source_key}}"
              # HARDCODED, not a parameter. The two replay shapes fix different problems,
              # and an operator picking the wrong one during an incident is the mistake
              # two separate jobs exist to prevent.
              run-type: kafka_replay
              rerun-id: "{{job.parameters.rerun_id}}"
              replay-starting-offsets: "{{job.parameters.replay_starting_offsets}}"
              replay-starting-timestamp: "{{job.parameters.replay_starting_timestamp}}"
              replay-ending-offsets: "{{job.parameters.replay_ending_offsets}}"
              replay-ending-timestamp: "{{job.parameters.replay_ending_timestamp}}"
              job-run-id: "{{job.run_id}}"

    replay_curated:
      name: "[${bundle.target}] Kafka Ingest - REPLAY Curated from Landing"
      description: >-
        Re-parse existing landing rows into curated against the current/corrected schema.
        Does not contact Kafka. Curated rows matching (topic, kafka_partition,
        kafka_offset) are updated in place.
      max_concurrent_runs: 1
      queue:
        enabled: false

      parameters:
        - name: source_key
          default: ""
        - name: rerun_id
          default: ""
        - name: replay_landing_filter
          # REQUIRED. SQL predicate over the LANDING table, e.g.
          #   ingest_date BETWEEN '2026-08-01' AND '2026-08-03'
          #   writer_schema_id = 5513
          # The topic predicate is added automatically. Landing is one table per topic,
          # so it matches everything - but it makes a mistyped table name produce an
          # empty replay rather than another topic's rows in this curated table.
          default: ""
        - name: config_root
          default: ${workspace.file_path}/conf
        - name: environment
          # Selects conf/environments/<env>.yaml. Defaulted from the bundle target, so the
          # environment is never typed twice and a replay cannot be aimed at the wrong one.
          default: ${bundle.target}

      environments:
        - environment_key: ingest_env
          spec:
            client: "3"
            dependencies:
              - ./dist/*.whl

      tasks:
        - task_key: replay_curated
          environment_key: ingest_env
          max_retries: 0
          retry_on_timeout: false
          timeout_seconds: 21600
          python_wheel_task:
            package_name: kafka_ingest
            entry_point: run-replay
            named_parameters:
              config-root: "{{job.parameters.config_root}}"
              environment: "{{job.parameters.environment}}"
              source-key: "{{job.parameters.source_key}}"
              run-type: curated_replay
              rerun-id: "{{job.parameters.rerun_id}}"
              replay-landing-filter: "{{job.parameters.replay_landing_filter}}"
              job-run-id: "{{job.run_id}}"
