# =====================================================================================
# CLOUD STORAGE REGISTER
#
# THE REGISTER PATTERN - identical to conf/clusters.yaml, conf/registries.yaml and
# conf/jdbc.yaml, and deliberately so. There is one mechanism for "what exists out there",
# not one per source type:
#
#   * This file records WHAT EXISTS and what is TRUE IN EVERY ENVIRONMENT: the auth mode,
#     the secret KEY NAMES. Never an account key, never a client secret.
#   * conf/environments/<env>.yaml overrides NAMED PROFILES in this file with what differs
#     per environment: the storage account, the container, the secret SCOPE - exactly the
#     split conf/jdbc.yaml uses for host/service_name/secret_scope.
#   * A profile named in an environment file that does not exist here is a hard error
#     listing the profiles that do. That is what keeps this file the single answer to
#     "which storage do we read from?" - a typo cannot quietly create a new profile.
#   * A source file references a profile BY NAME. It never contains an account URL.
#
# THERE IS NO account/container HERE, AND THAT IS DELIBERATE, same reasoning as
# conf/jdbc.yaml having no host: an account and a container are per-environment facts, set
# below in conf/environments/<env>.yaml, so a profile is meaningless read alone and
# complete only once an environment overlay is merged in.
#
# The top-level key must match the filename (`storage.yaml` holds `storage:`). The
# framework discovers registers by listing conf/*.yaml, so adding one is a new file and no
# code change at all.
#
# TWO AUTH MODES - sources/file/security.py builds the ADLS Gen2 (`abfss://`) session
# options for each:
#   account_key         fs.azure.account.key.<account>.dfs.core.windows.net = <key>
#   service_principal    OAuth 2.0 client-credentials against Entra ID
# Everything else Azure/ADLS supports (SAS tokens, managed identity, Unity Catalog
# credential passthrough) is deliberately not implemented - see sources/file/security.py's
# module docstring. Adding one is a code change, not a config guess.
#
# TIER MARKERS
#   [MUST CHANGE]         Placeholder. Will not work as shipped.
#   [NICE TO CHANGE]      Sensible default. Tune with a reason.
#   [NO CHANGE REQUIRED]  Dictated by how the storage account is configured.
#
# Full reference: docs/CONFIGURATION.md
# =====================================================================================

storage:

  # ===================================================================================
  # The claims landing container. Account-key auth, the simplest of the two modes.
  # ===================================================================================
  adls_landing_prod:

    # ----------------------------------------------------------- NO CHANGE REQUIRED --
    auth_mode: account_key

    # ------------------------------------------------------------------ MUST CHANGE --
    # Name of the KEY inside the environment's secret scope - NOT the value. The account
    # this names should have READ-ONLY (Storage Blob Data Reader) access to the container:
    # this framework only ever reads, and an account that can do more is an account that
    # can be made to do more by a mistake somewhere else.
    account_key_secret_key: adls-landing-account-key

  # ===================================================================================
  # A worked example of the OTHER auth mode - a container reached via a service
  # principal's OAuth client credentials rather than a shared account key.
  # ===================================================================================
  adls_claims_service_principal:
    auth_mode: service_principal
    client_id_secret_key: adls-claims-sp-client-id
    client_secret_secret_key: adls-claims-sp-client-secret

    # --------------------------------------------------------------- NICE TO CHANGE --
    # The Entra ID (Azure AD) tenant the service principal belongs to. Not a secret, but
    # kept in the register rather than the environment file - it is a property of WHICH
    # service principal this is, not of the environment it happens to run in.
    tenant_id: "<CHANGE_ME_tenant_id>"
