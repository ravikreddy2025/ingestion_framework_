# =====================================================================================
# JDBC CONNECTION REGISTER
#
# THE REGISTER PATTERN - identical to conf/clusters.yaml and conf/registries.yaml, and
# deliberately so. There is one mechanism for "what exists out there", not one per source
# type:
#
#   * This file records WHAT EXISTS and what is TRUE IN EVERY ENVIRONMENT: the auth mode,
#     the secret KEY NAMES, the driver options. Never a password, never a token.
#   * conf/environments/<env>.yaml overrides NAMED PROFILES in this file with what differs
#     per environment: the host, the port, the service name, the secret SCOPE.
#   * A profile named in an environment file that does not exist here is a hard error
#     listing the profiles that do. That is what keeps this file the single answer to
#     "which databases do we extract from?" - a typo cannot quietly create a new profile.
#   * A source file references a profile BY NAME. It never contains an endpoint.
#
# The top-level key must match the filename (`jdbc.yaml` holds `jdbc:`). The framework
# discovers registers by listing conf/*.yaml, so adding one is a new file and no code
# change at all.
#
# THERE IS NO URL HERE, AND THAT IS DELIBERATE. sources/oracle/config.py builds the JDBC
# URL from host + port + (service_name | sid), all validated. A URL written as a string is
# also the obvious place for somebody to paste `user/password@host`, and `url` is the one
# option whose NAME gives a log redactor no hint that it might carry a credential.
#
# TIER MARKERS
#   [MUST CHANGE]         Placeholder. Will not work as shipped.
#   [NICE TO CHANGE]      Sensible default. Tune with a reason.
#   [NO CHANGE REQUIRED]  Dictated by how the database is configured.
#
# Full reference: docs/CONFIGURATION.md
# =====================================================================================

jdbc:

  # ===================================================================================
  # The core claims database. Service-name form, username/password from the environment's
  # secret scope. This is the shape every Oracle source starts from.
  # ===================================================================================
  oracle_prod_core:

    # ----------------------------------------------------------- NO CHANGE REQUIRED --
    # The only mode sources/oracle/security.py implements. Oracle wallets and Kerberos
    # each need a file or a ticket staged on the EXECUTORS - a compute-profile problem
    # rather than a configuration one - so adding either is a code change, deliberately.
    auth_mode: basic

    # ------------------------------------------------------------------ MUST CHANGE --
    # Names of the KEYS inside the environment's secret scope - NOT the values. Keep the
    # key names identical across environments; the SCOPE is what changes, and it is set
    # per environment in conf/environments/<env>.yaml.
    #
    # The account these name should be READ-ONLY on the extracted schemas. This framework
    # only ever issues SELECT, and an account that can do more is an account that can be
    # made to do more by a mistake somewhere else.
    username_key: oracle-core-username
    password_key: oracle-core-password

    # -------------------------------------------------------------- NICE TO CHANGE --
    # The listener port. 1521 is Oracle's default and is the code default too; it is
    # written out here because a database behind a non-default port is common enough that
    # a reader should see where it goes.
    port: 1521

    # Extra JDBC CONNECTION PROPERTIES, passed to the driver verbatim.
    #
    # DELIBERATELY EMPTY. The obvious candidate is oracle.jdbc.mapDateToTimestamp, which
    # decides whether an Oracle DATE reaches Spark with its time component intact - and
    # whether it is needed, and under which name, is VB-03. Setting it before that is
    # answered would be guessing at a property that silently truncates every timestamp in
    # a column if it is wrong in either direction.
    extra_options: {}

  # ===================================================================================
  # A legacy database reached by SID rather than service name. Kept as a worked example
  # of the older URL form, which is still what many on-premise instances present.
  #
  #   service_name -> jdbc:oracle:thin:@//host:port/service
  #   sid          -> jdbc:oracle:thin:@host:port:sid
  #
  # Exactly one of the two, per profile. Setting both, or neither, is a config error that
  # names the choice - guessing between them produces a connection failure naming neither.
  # ===================================================================================
  oracle_legacy_billing:
    auth_mode: basic
    username_key: oracle-billing-username
    password_key: oracle-billing-password
    port: 1521
    extra_options: {}
