# =====================================================================================
# ENVIRONMENT: dev        Layer 2 of 5 - overrides conf/defaults.yaml
#
# Holds ONLY what differs between environments and that the CODE needs:
#   - catalog name           (feeds every table path and the checkpoint volume)
#   - Kafka broker endpoints (differ per environment)
#   - secret scope names     (one Key Vault per environment)
#   - registry URLs
#   - any per-environment tuning
#
# Deliberately NOT here: storage accounts, external locations, credentials, UC metastore
# wiring, cluster policies. Those are handled by your Databricks deployment - the code
# never sees them.
#
# The environment is chosen by the --environment job parameter, which the DAB job
# definitions default to ${bundle.target}. You never type it twice.
#
# TIER MARKERS
#   [MUST CHANGE]         Placeholder or environment-specific. Will not work as shipped.
#   [NICE TO CHANGE]      Sensible default. Tune with a reason.
#   [NO CHANGE REQUIRED]  Framework contract or platform standard.
# Full reference: docs/CONFIGURATION.md section 1
# =====================================================================================

# Substituted into any {placeholder} in defaults / sources / cluster / registry values.
vars:
  catalog: platform_dev                                                     # [MUST CHANGE]
  # Operational catalog: the control and state tables. MUST match `ops_catalog`
  # for this target in databricks.yml - a test asserts they agree.           # [MUST CHANGE]
  ops_catalog: ops_dev
  # The three ops-catalog schemas (docs/build_log/DECISIONS.md D-06). There is no reason
  # for these to differ by environment - only catalog/ops_catalog do - so every environment
  # file carries the same three values.                                [NO CHANGE REQUIRED]
  audit_schema: audit
  control_schema: ingestion
  logs_schema: logs

# Overrides conf/defaults.yaml, for every source of EVERY TYPE in this environment.
# Only put a setting here if every source type understands it - a Kafka-only key here is
# an unknown key for every Oracle and file source in dev.                    [NICE TO CHANGE]
defaults: {}

# Overrides conf/defaults/<source_type>.yaml, for every source of ONE type in this
# environment. This is where per-environment tuning of a type-specific setting belongs.
#                                                                             [NICE TO CHANGE]
defaults_by_type:
  kafka:
    # Small batches in dev: faster feedback, and a failure costs seconds not minutes.
    max_offsets_per_trigger: 100000

    # Dev usually wants a small, recent sample rather than the full retained history.
    # Remember this only applies on a topic's FIRST run, before a checkpoint exists.
    starting_offsets: latest

# Overrides named profiles in conf/clusters.yaml. The profile must already exist there -
# conf/clusters.yaml stays the single register of which clusters exist.       [MUST CHANGE]
clusters:
  confluent_cloud_shared:
    bootstrap_servers: "pkc-dev01.westeurope.azure.confluent.cloud:9092"
    secret_scope: kv-kafka-dev

  cp_onprem_rcm:
    bootstrap_servers: "kafka-rcm-dev01.corp.internal:9093"
    secret_scope: kv-kafka-rcm-dev

  cp_onprem_antifraud:
    bootstrap_servers: "kafka-af-dev01.fraud.internal:9094"
    secret_scope: kv-kafka-antifraud-dev

# Overrides named profiles in conf/registries.yaml.                          [MUST CHANGE]
registries:
  confluent_cloud_shared:
    url: "https://psrc-dev01.westeurope.azure.confluent.cloud"
    secret_scope: kv-kafka-dev

  sr_onprem_rcm:
    url: "https://schema-registry-rcm-dev.corp.internal:8081"
    secret_scope: kv-kafka-rcm-dev

  sr_onprem_antifraud:
    url: "https://schema-registry-af-dev.fraud.internal:8081"

# Overrides named profiles in conf/jdbc.yaml. The profile must already exist there -
# conf/jdbc.yaml stays the single register of which databases we extract from. Host,
# service name and secret scope are what differ per environment; the auth mode and the
# secret KEY NAMES do not, so they stay in the register.                     [MUST CHANGE]
jdbc:
  oracle_prod_core:
    host: "oracle-core-dev01.corp.internal"
    service_name: CLAIMSDEV
    secret_scope: kv-oracle-dev

  oracle_legacy_billing:
    host: "oracle-billing-dev01.corp.internal"
    sid: BILLDEV
    secret_scope: kv-oracle-dev

# Overrides named profiles in conf/storage.yaml. The profile must already exist there -
# conf/storage.yaml stays the single register of which storage accounts we read from.
# Account, container and secret scope differ per environment; the auth mode and the secret
# KEY NAMES do not, so they stay in the register.                            [MUST CHANGE]
storage:
  adls_landing_prod:
    account: "adlsclaimsdev01"
    container: "landing"
    secret_scope: kv-adls-dev

  adls_claims_service_principal:
    account: "adlsclaimsdev01"
    container: "landing"
    secret_scope: kv-adls-dev
