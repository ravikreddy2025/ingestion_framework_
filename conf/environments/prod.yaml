# =====================================================================================
# ENVIRONMENT: prod        Layer 2 of 5 - overrides conf/defaults.yaml
#
# conf/defaults.yaml and conf/defaults/<source_type>.yaml already carry the
# production-safe values (fail_on_data_loss, earliest, availableNow), so this file only
# supplies what is genuinely environment-specific: the catalog, the broker endpoints and
# the secret scopes.
#
# If a change here would also be correct in preprod, put it in the defaults instead.
#
# TIER MARKERS - see conf/environments/dev.yaml for the legend. Full reference:
# docs/CONFIGURATION.md section 1
# =====================================================================================

vars:
  catalog: platform_prod                                                    # [MUST CHANGE]
  # Operational catalog: the control and state tables. MUST match `ops_catalog`
  # for this target in databricks.yml - a test asserts they agree.           # [MUST CHANGE]
  ops_catalog: ops_prod
  # The three ops-catalog schemas (docs/build_log/DECISIONS.md D-06). There is no reason
  # for these to differ by environment - only catalog/ops_catalog do - so every environment
  # file carries the same three values.                                [NO CHANGE REQUIRED]
  audit_schema: audit
  control_schema: ingestion
  logs_schema: logs

# Intentionally empty: production behaviour IS the default in conf/defaults.yaml and
# conf/defaults/<source_type>.yaml. Anything added here silently diverges prod from what
# preprod rehearsed.
#
# `defaults:` applies to every source type; `defaults_by_type: <type>:` applies to one.
# See conf/environments/dev.yaml for a worked example of the second.        [NICE TO CHANGE]
defaults: {}
defaults_by_type: {}

clusters:                                                                    # [MUST CHANGE]
  confluent_cloud_shared:
    bootstrap_servers: "pkc-abc12.westeurope.azure.confluent.cloud:9092"
    secret_scope: kv-kafka-prod

  cp_onprem_rcm:
    bootstrap_servers: "kafka-rcm-01.corp.internal:9093,kafka-rcm-02.corp.internal:9093"
    secret_scope: kv-kafka-rcm

  cp_onprem_antifraud:
    bootstrap_servers: "kafka-af-01.fraud.internal:9094,kafka-af-02.fraud.internal:9094"
    secret_scope: kv-kafka-antifraud

registries:                                                                  # [MUST CHANGE]
  confluent_cloud_shared:
    url: "https://psrc-xyz98.westeurope.azure.confluent.cloud"
    secret_scope: kv-kafka-prod

  sr_onprem_rcm:
    url: "https://schema-registry-rcm.corp.internal:8081"
    secret_scope: kv-kafka-rcm

  sr_onprem_antifraud:
    url: "https://schema-registry-af.fraud.internal:8081"

# Overrides named profiles in conf/jdbc.yaml. The profile must already exist there -
# conf/jdbc.yaml stays the single register of which databases we extract from. Host,
# service name and secret scope are what differ per environment; the auth mode and the
# secret KEY NAMES do not, so they stay in the register.                     [MUST CHANGE]
jdbc:
  oracle_prod_core:
    host: "oracle-core01.corp.internal"
    service_name: CLAIMSPRD
    secret_scope: kv-oracle-prod

  oracle_legacy_billing:
    host: "oracle-billing01.corp.internal"
    sid: BILLPRD
    secret_scope: kv-oracle-prod

# Overrides named profiles in conf/storage.yaml - see conf/environments/dev.yaml.
#                                                                             [MUST CHANGE]
storage:
  adls_landing_prod:
    account: "adlsclaims01"
    container: "landing"
    secret_scope: kv-adls-prod

  adls_claims_service_principal:
    account: "adlsclaims01"
    container: "landing"
    secret_scope: kv-adls-prod
