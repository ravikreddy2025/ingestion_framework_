# =====================================================================================
# DEFAULTS - layer 1 of 5. Applies to EVERY source of EVERY type, in EVERY environment.
#
# THE MERGE CHAIN (later always wins on a per-key basis; absent keys fall through)
#
#   1.  conf/defaults.yaml                 <- you are here. Common to everything.
#   1b. conf/defaults/<source_type>.yaml   <- common to every source of ONE type
#   2.  conf/environments/<env>.yaml       <- what differs between dev / preprod / prod
#                                             (`defaults:` for every type, plus
#                                             `defaults_by_type:` for one type)
#   3.  conf/sources/<source_key>.yaml     <- what is unique to one source
#   4.  operational control table          <- support-team runtime overrides, no deploy
#   5.  job parameters                     <- one-off overrides typed into Workflows
#
# Layers 1-3 are STRUCTURAL (Git, PR-reviewed). Layers 4-5 are OPERATIONAL.
#
# WHICH FILE DOES A SETTING BELONG IN?
#   here                      same value for every source of every type
#   defaults/<type>.yaml      same value for every source of ONE type, e.g. a trigger
#   environments/<env>.yaml   varies by environment
#   sources/<key>.yaml        varies by source
#
# A setting that only one source TYPE understands must NOT go here. Every source of every
# type is validated against this file, so a type-specific key here is an unknown key for
# every other type - which is exactly the error you want, at the wrong moment.
#
# TIER MARKERS
#   [MUST CHANGE]         Placeholder or environment-specific. Will not work as shipped.
#   [NICE TO CHANGE]      Sensible default. Tune with a reason.
#   [NO CHANGE REQUIRED]  Framework contract or platform standard.
#
# Full reference: docs/CONFIGURATION.md section 1
#
# PLACEHOLDERS
#   {catalog}      and any other key under `vars:` in the environment file
#   {source_key}   the source's config filename without .yaml
#   {domain}       the source's `domain:` value
# An unresolved placeholder is a hard error naming the key - it never reaches a cluster.
# =====================================================================================

defaults:

  # --- THE FRAMEWORK'S OWN THREE TABLES ------------------------------ [NO CHANGE REQUIRED]
  # Shared by every source of every type. Only the catalog and schema vars change between
  # environments, so they belong here rather than repeated in every source file. Each is
  # created by sql/01_operational_config.sql or sql/02_layer_tables.sql when an environment
  # is provisioned; the job creates audit and state itself if they are missing.
  #
  # These three are FRAMEWORK-OWNED KEYS (framework/config.py FRAMEWORK_STRUCTURAL_KEYS):
  # no SOURCE_SPEC declares them, because the framework reads them and no source does.
  #
  # ONE OPS CATALOG, THREE SCHEMAS (docs/build_log/DECISIONS.md D-06). All three live under
  # {ops_catalog}, split by purpose rather than by data-vs-operational: audit is queried
  # constantly during triage and has its own schema; control and state share a schema
  # because they have the same blast radius and audience; {logs_schema} is reserved for
  # structured logging, not written yet. {audit_schema} / {control_schema} / {logs_schema}
  # are environment `vars:` (conf/environments/<env>.yaml), same as {catalog} / {ops_catalog}.

  # One row per (run, layer, status), for every source. First stop for incident triage.
  audit_table: "{ops_catalog}.{audit_schema}.ingest_audit"

  # Durable watermarks and run sequences. Written by the ingestion job ONLY, and its writes
  # are mandatory - see framework/state.py.
  state_table: "{ops_catalog}.{control_schema}.ingest_state"

  # Layer 4: the support team's runtime overrides. Written by support, read by the job.
  control_table: "{ops_catalog}.{control_schema}.ingest_control"

  # --- TABLE PROPERTIES ------------------------------------------------------------------
  # Delta table properties applied to EVERY table the framework creates, in every layer.
  # Applied at CREATE time only - editing this does not alter a table that already exists
  # (use ALTER TABLE for that).
  #
  # A source can override the whole map in its own file if one feed genuinely needs
  # different properties. Most never should.
  table_properties:
    # ---- ON by default ------------------------------------------------ [NO CHANGE REQUIRED]
    # Streaming appends, batch appends and per-layer audit rows all produce small files;
    # letting Delta compact them removes an entire class of "why is this table slow" tickets.
    delta.autoOptimize.optimizeWrite: "true"
    delta.autoOptimize.autoCompact: "true"

    # ---- OFF by default - uncomment inside a source's OWN table_properties [NICE TO CHANGE]
    # (never here) to opt one source in --------------------------------------------------
    # These are commented OUT here deliberately: enabling any of them changes storage cost
    # or write behaviour, and that should be a decision for one source, made in that
    # source's PR - not a platform-wide default nobody chose. A source overrides the WHOLE
    # map, so copy this block into the source file and adjust rather than uncommenting it
    # here.
    #
    # Applied at CREATE time only, like every property in this map - see "Table properties"
    # in docs/CONFIGURATION.md. Changing any of these does NOT alter a table that already
    # exists; use ALTER TABLE ... SET TBLPROPERTIES for that.

    # Change Data Feed - lets a downstream consumer read only what changed since a given
    # version (table_changes()), instead of re-reading the whole table. Costs extra storage
    # per write. The operational control table already turns this on (sql/01) because a
    # small, rarely-written table can afford it; a high-volume landing table usually cannot.
    # delta.enableChangeDataFeed: "true"

    # How long DELETED DATA FILES are kept before VACUUM may remove them - i.e. how far back
    # time travel and point-in-time recovery still work. Delta's built-in default is 7 days
    # (interval 168 hours), which is also what vacuum_retention_hours defaults to in
    # databricks.yml. Setting a table property here would only matter for a VACUUM run that
    # supplies no explicit RETAIN - the maintenance job always does, so this is redundant
    # with vacuum_retention_hours for anything scheduled. It matters for an AD HOC VACUUM run
    # from a notebook. DO NOT set this anywhere near landing_retention_days (20 years) - that
    # is row retention, this is file retention, and confusing the two makes storage cost
    # unbounded. See WP-8 / sql/04_maintenance.sql for the distinction.
    # delta.deletedFileRetentionDuration: "interval 168 hours"

    # How long the DELTA TRANSACTION LOG itself is kept - governs how far back DESCRIBE
    # HISTORY and time-travel-by-version can see, independent of whether the underlying data
    # files still exist. Delta's built-in default is 30 days. Raise it on a table where
    # "what changed and when" needs to be answerable further back than a month - the audit
    # table is a natural candidate if incident retrospectives ever need it.
    # delta.logRetentionDuration: "interval 30 days"

    # Blocks UPDATE/DELETE/MERGE on the table outright, at the Delta layer.
    # DO NOT SET THIS ON ANY LAYER TABLE: every layer is written via MERGE during a replay,
    # and this property would make every replay fail. It is listed here only because it is a
    # real, sometimes-useful property in general Delta usage; there is no table this
    # framework creates where setting it is currently safe.
    # delta.appendOnly: "true"
