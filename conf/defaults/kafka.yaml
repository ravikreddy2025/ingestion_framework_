# =====================================================================================
# KAFKA DEFAULTS - layer 1b of 5. Applies to EVERY Kafka source, in EVERY environment.
#
# Merged immediately after conf/defaults.yaml and before conf/environments/<env>.yaml.
# Everything here is Kafka-specific: it is read only when a source file declares
# `source_type: kafka`, so nothing here is ever applied to an Oracle or file source.
#
# Put a setting here when its value is the same for every Kafka topic. Put it in
# conf/environments/<env>.yaml under `defaults_by_type: kafka:` when it varies by
# environment. Put it in conf/sources/<source_key>.yaml when it varies by topic.
#
# PLACEHOLDERS
#   {catalog}      and any other key under `vars:` in the environment file
#   {source_key}   the source's config filename without .yaml
#   {domain}       the source's `domain:` value
# =====================================================================================

defaults:

  # --- TARGETS ------------------------------------------------------------------------
  # ONE TABLE PER TOPIC in landing, curated and quarantine. Only audit is shared, and it
  # lives in conf/defaults.yaml because every source type writes to it.
  #
  # {topic_table} is the Kafka topic name with dots and hyphens turned into underscores,
  # because neither is legal in an unquoted Unity Catalog identifier:
  #     vector.patient.events.v1  ->  vector_patient_events_v1
  #
  # To override the name for one topic, set `table_name:` in that topic's file - NOT a full
  # table name here or there. That keeps the catalog and schema in one place, so a source
  # file still never contains a catalog.
  #
  # STAGE NOTE: {topic_table} is derived by the Kafka config loader today. Stage 2 moves
  # target-name resolution into framework/tables.py, driven by these patterns.
  landing_table:    "{catalog}.landing.{topic_table}"
  curated_table:    "{catalog}.curated.{topic_table}"
  quarantine_table: "{catalog}.landing.{topic_table}_quarantine"

  # Volume-backed checkpoint ROOT. The framework appends /<source_key>/primary or
  # /<source_key>/replay/<rerun_id> itself - never add the topic name here.
  checkpoint_root: "/Volumes/{catalog}/ingestion/checkpoints"

  # --- STREAMING ----------------------------------------------------------------------
  # Prefix for the Spark-managed consumer group, so this consumer is identifiable in
  # broker-side monitoring. Replays automatically get a distinct suffix.
  consumer_group_prefix: "dbx-{source_key}"

  # FIRST RUN ONLY. Once a checkpoint exists it always wins and this is ignored.
  starting_offsets: earliest

  # Drain everything available, then stop - the right shape for a once-daily job and the
  # only trigger under which a Workflows run has a natural end.
  trigger: availableNow

  # Fail loudly when Kafka has aged out records we never consumed. Overriding this to
  # false means silently accepting gaps and needs explicit domain sign-off.
  fail_on_data_loss: true

  # Required for the ce_* CloudEvent columns to populate - they come from Kafka headers.
  include_headers: true

  # --- TABLE LAYOUT -------------------------------------------------------------------
  # Delta allows PARTITIONED BY or CLUSTER BY, never both. See docs/DESIGN.md.
  # Both layers are one table per topic, so `topic` is constant inside each and worthless
  # as a partition key.
  # landing: ingest_date - bounds partition growth and makes retention a partition drop.
  # curated: event_date - the date of ce_time, falling back to kafka_timestamp.
  landing_partition_by: [ingest_date]
  curated_partition_by: [event_date]

  # Which column orders the within-batch dedup. Only relevant when a source sets
  # curated_dedup_keys.
  curated_dedup_order_by: kafka_timestamp

  # --- DESERIALIZATION ----------------------------------------------------------------
  # The curated payload struct's SHAPE follows the subject's latest registered version.
  # Each record is still DECODED with its own writer schema from the wire header - that is
  # what makes a mixed-version microbatch work.
  reader_schema_mode: registry_latest

  # Platform default: a record that cannot be parsed fails the batch loudly. Support can
  # flip this to 'quarantine' via the control table to unblock a stuck stream - no deploy.
  on_deser_error: fail
