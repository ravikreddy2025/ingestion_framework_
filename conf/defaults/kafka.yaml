# =====================================================================================
# KAFKA DEFAULTS - layer 1b of 5. Applies to EVERY Kafka source, in EVERY environment.
#
# Merged immediately after conf/defaults.yaml and before conf/environments/<env>.yaml.
# Everything here is Kafka-specific: it is read only when a source file declares
# `source_type: kafka`, so nothing here is ever applied to an Oracle or file source.
#
# Put a setting here when its value is the same for every Kafka topic. Put it in
# conf/environments/<env>.yaml under `defaults_by_type: kafka:` when it varies by
# environment. Put it in conf/sources/<source_key>.yaml when it varies by topic.
#
# EVERY KEY HERE IS DECLARED IN sources/kafka/spec.py. A key that is not is a hard error
# at startup naming the key - which is the point: a setting that silently does nothing is
# worse than a missing one.
#
# PLACEHOLDERS
#   {catalog}      and any other key under `vars:` in the environment file
#   {source_key}   the source's config filename without .yaml
#   {domain}       the source's `domain:` value
#
# TIER MARKERS
#   [MUST CHANGE]         Placeholder. Will not work as shipped.
#   [NICE TO CHANGE]      Sensible default. Tune with a reason - most are also
#                         operationally overridable per source, noted where they are.
#   [NO CHANGE REQUIRED]  Framework contract or platform standard.
# Full reference: docs/CONFIGURATION.md section 4
# =====================================================================================

defaults:

  # --- TARGETS ------------------------------------------------------ [NO CHANGE REQUIRED]
  # ONE TABLE PER TOPIC in landing, curated and quarantine. Only audit is shared, and it
  # lives in conf/defaults.yaml because every source type writes to it.
  #
  # {topic_table} is the Kafka topic name with dots and hyphens turned into underscores,
  # because neither is legal in an unquoted Unity Catalog identifier:
  #     vector.patient.events.v1  ->  vector_patient_events_v1
  #
  # It is the one placeholder the CONFIG LOADER leaves alone: only the source can compute
  # it, so sources/kafka/spec.py declares it in target_tokens and framework/tables.py
  # renders it at the top of the run - before anything connects. Everything else must
  # resolve at load, which is what keeps a typo a startup error.
  #
  # To override the name for one topic, set `table_name:` in that topic's file - NOT a full
  # table name here or there. That keeps the catalog and schema in one place, so a source
  # file still never contains a catalog.
  landing_table:    "{catalog}.landing.{topic_table}"
  curated_table:    "{catalog}.curated.{topic_table}"
  quarantine_table: "{catalog}.landing.{topic_table}_quarantine"

  # Volume-backed checkpoint ROOT. The framework appends /<source_key>/primary or
  # /<source_key>/replay/<rerun_id> itself - never add the topic name here.
  checkpoint_root: "/Volumes/{catalog}/ingestion/checkpoints"

  # --- STREAMING ------------------------------------------------------------- [NICE TO CHANGE]
  # Prefix for the Spark-managed consumer group, so this consumer is identifiable in
  # broker-side monitoring. Spark OVERRIDES kafka.group.id, so this prefix is the only
  # supported knob. Replays automatically get a distinct suffix.
  consumer_group_prefix: "dbx-{source_key}"

  # FIRST RUN ONLY. Once a checkpoint exists it always wins and this is ignored.
  starting_offsets: earliest

  # Drain everything available, then stop - the right shape for a scheduled job and the
  # only trigger under which a Workflows run has a natural end.                [NO CHANGE REQUIRED]
  #
  # CADENCE IS NOT SET HERE - it is in the job definition, and it is not a free choice:
  # the schedule must be at most ONE THIRD of this topic's Kafka retention. See the
  # MUST-READ row in docs/CONFIGURATION.md.
  trigger: availableNow

  # Fail loudly when Kafka has aged out records we never consumed. Overriding this to
  # false means silently accepting gaps and needs explicit domain sign-off. Q13 in    [NO CHANGE REQUIRED]
  # sql/03_support_queries.sql lists every source currently running with it disabled.
  fail_on_data_loss: true

  # MUST HAVE A VALUE. Unset is not "no limit" in any useful sense - it means the entire
  # backlog arrives as ONE microbatch, so a first run on a retained topic becomes a single
  # enormous batch whose failure costs the whole run. Under availableNow this does NOT cap
  # what the run consumes; it splits the backlog into several bounded batches.  [NICE TO CHANGE]
  # Operationally overridable: ingest_control.kafka_max_offsets_per_trigger.
  max_offsets_per_trigger: 1000000

  # Read parallelism. Without it, parallelism is capped at the topic's partition count no
  # matter how large the cluster is.                                           [NICE TO CHANGE]
  #
  # A PLAIN INTEGER, deliberately not a computed multiple of the partition count: deriving
  # that needs a Kafka admin client, and the runtime dependencies are PyYAML and requests.
  # Rule of thumb: roughly 4x the topic's partition count. It only ever SPLITS offset
  # ranges, never merges them, so over-setting is cheap - confirm the partition count with
  # the producing team at onboarding and set it once.
  min_partitions: 32

  # --- TABLE LAYOUT ----------------------------------------------------- [NO CHANGE REQUIRED]
  # Delta allows PARTITIONED BY or CLUSTER BY, never both. See docs/DESIGN.md.
  # Both layers are one table per topic, so `topic` is constant inside each and worthless
  # as a partition key.
  # landing: ingest_date - bounds partition growth and makes retention a partition drop.
  # curated: event_date - the date of ce_time, falling back to kafka_timestamp. It is also
  #          what bounds a curated replay's MERGE, which is why it must never be NULL.
  landing_partition_by: [ingest_date]
  curated_partition_by: [event_date]

  # Which column orders the within-batch dedup. Only relevant when a source sets
  # curated_dedup_keys.
  curated_dedup_order_by: kafka_timestamp

  # --- DESERIALIZATION --------------------------------------------------- [NO CHANGE REQUIRED]
  # The curated payload struct's SHAPE follows the subject's latest registered version.
  # Each record is still DECODED with its own writer schema from the wire header - that is
  # what makes a mixed-version microbatch work. There are exactly two modes and there is
  # deliberately no third - see sources/kafka/config.py.
  reader_schema_mode: registry_latest

  # Platform default: a record that cannot be parsed FAILS THE BATCH loudly. Support flips
  # this to QUARANTINE via ingest_control.kafka_failure_mode to unblock a stuck stream -
  # no deploy, and the records stay recoverable from landing afterwards. The two values are
  # the same two the CHECK constraint on that column allows.
  failure_mode: FAILFAST
